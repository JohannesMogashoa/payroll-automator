name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build-test-docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --configuration Release --no-restore
      - name: Test
        run: dotnet test tests/PayrollAutomator.Tests/PayrollAutomator.Tests.csproj --configuration Release --no-build
      - name: Build Docker image
        run: docker build --tag payroll-automator:ci .
      - name: Smoke test container health endpoint
        shell: bash
        run: |
          set -euo pipefail
          container_id=$(docker run --detach --publish 8080:8080 payroll-automator:ci)
          trap 'docker logs "$container_id"; docker rm --force "$container_id"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/healthz; then
              exit 0
            fi
            sleep 2
          done
          exit 1
