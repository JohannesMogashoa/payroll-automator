name: Production deployment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      DEPLOY_HOST: ${{ vars.PAYROLL_DEPLOY_HOST }}
      DEPLOY_HOST_KEY: ${{ vars.PAYROLL_DEPLOY_HOST_KEY }}
      DEPLOY_USER: payroll-deploy

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/PayrollAutomator.Tests/PayrollAutomator.Tests.csproj --configuration Release --no-build

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable image
        shell: bash
        run: |
          set -euo pipefail
          image_ref="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
          echo "IMAGE_REF=${image_ref}" >> "$GITHUB_ENV"
          docker build --tag "$image_ref" .
          docker push "$image_ref"

      - name: Join the deployment tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci-deploy

      - name: Configure the deployment host key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_HOST_KEY"
          install -m 0700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_HOST_KEY" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"

      - name: Transfer and deploy the exact image
        shell: bash
        run: |
          set -euo pipefail
          docker save "$IMAGE_REF" \
            | gzip --stdout \
            | ssh -o BatchMode=yes -o RequestTTY=no "$DEPLOY_USER@$DEPLOY_HOST" \
                "sudo -n /usr/local/sbin/payroll-automator-deploy deploy '$IMAGE_REF'"

